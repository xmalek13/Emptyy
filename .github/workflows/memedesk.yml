# Continuous paper-trading. Each job is one chunk under the 6 hour Actions limit.
# The chunk commits state to the `data` branch and workflow_dispatch starts the next
# chunk. The cron is only a backup for when a chunk dies before it can hand off.
# Concurrency keeps a single chunk running: a cron tick queues, it does not overlap.
name: MemeDesk paper

on:
  workflow_dispatch:
    inputs:
      end_at:
        description: "UTC time after which chunks stop and open positions are marked to market (ISO-8601)"
        required: false
        default: "2026-11-20T14:00:00Z"
        type: string
      chunk_minutes:
        description: "Chunk length in minutes (capped at 340 so the job stays under the 6h limit)"
        required: false
        default: "340"
        type: string
  schedule:
    - cron: "*/30 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/memedesk.yml"
      - "desk.py"
      - "report.py"
      - "run.sh"
      - "scripts/actions_chunk.sh"

permissions:
  contents: write
  actions: write

concurrency:
  group: memedesk-paper
  cancel-in-progress: false

jobs:
  chunk:
    name: Paper chunk
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout strategy
        uses: actions/checkout@v4

      - name: Run paper-trading chunk
        env:
          # Empty on schedule and push; the script defaults these and, when a
          # data-branch snapshot exists, keeps the end time stored there.
          END_AT: ${{ github.event.inputs.end_at }}
          CHUNK_MINUTES: ${{ github.event.inputs.chunk_minutes }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/actions_chunk.sh
